[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "software_development_ml_practice_1"
version = "0.0.1"
description = "Machine learning project focused on data exploration, model training, visualization, and performance evaluation."
authors = [
  { name = "Ruth Altamirano" },
  { name = "Malena Chacón" },
  { name = "Odei Martinez de Morentin" }
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "scipy>=1.18.1",
    "scikit-learn>=1.9.0",
    "tensorflow>=2.21.0",
    "torch>=2.13.0",
    "pytorch-lightning>=2.6.5",
    "torchvision>=0.28.0",
    "matplotlib>=3.11.1",
    "seaborn>=0.13.2",
    "jupyterlab>=4.6.3",
    "ipykernel>=7.3.0",
    "ipython>=9.16.1",
    "gradio>=6.26.0",
    "black>=24.4.0",
    "flake8>=7.1.0",
    "isort>=5.13.2",
    "joblib>=1.4.2",
    "python-dotenv>=1.0.1",
    "tqdm>=4.70.0",
    "loguru>=0.7.3",
]

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.isort]
profile = "black"
known_first_party = ["software_development_ml_practice_1"]
force_sort_within_sections = true

[dependency-groups]
dev = [
    "furo>=2025.12.19",
    "sphinx>=9.1.0",
]
